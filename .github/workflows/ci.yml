# Runs on every push and pull request. Fully offline: uses the mock LLM, needs no secrets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -v
      - name: Run all 14 RAG flows (mock LLM)
        run: python run.py all --mock --report report.md
      - name: Publish job summary
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build
      - name: Unit tests
        run: dotnet test --no-build
      - name: Run all 14 RAG flows (mock LLM)
        run: dotnet run --project src/RagApp --no-build -- all --mock --report report.md
      - name: Publish job summary
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true
